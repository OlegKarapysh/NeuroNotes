name: PR Build

on:
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build, test, and format check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore dependencies
        run: dotnet restore NeuroNotes.slnx

      - name: Build
        run: dotnet build NeuroNotes.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test --solution NeuroNotes.slnx --configuration Release --no-restore

      - name: Verify formatting
        run: dotnet format NeuroNotes.slnx --verify-no-changes --no-restore