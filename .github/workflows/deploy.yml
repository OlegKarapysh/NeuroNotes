name: Build and Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore dependencies
        run: dotnet restore NeuroNotes.slnx

      - name: Build
        run: dotnet build NeuroNotes.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test --solution NeuroNotes.slnx --configuration Release --no-restore

  build-and-push:
    name: Build and push Docker image
    needs: build-and-test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./src/NeuroNotes.WebApi/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_PORT=${{ vars.APP_PORT || '8080' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to DigitalOcean droplet
    needs: build-and-push
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute lowercase image name
        run: echo "IMAGE_NAME_LC=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Copy compose file to droplet
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_KEY_PASSPHRASE }}
          port: 22
          source: docker-compose.prod.yml
          target: /opt/neuronotes
          overwrite: true

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_KEY_PASSPHRASE }}
          port: 22
          script: |
            set -e
            cd /opt/neuronotes

            # Structural (non-secret) values for compose ${...} substitution.
            export APP_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}:latest"
            export APP_CONTAINER_NAME="${{ vars.CONTAINER_NAME }}"
            export HOST_PORT="${{ vars.HOST_PORT }}"
            export APP_PORT="${{ vars.APP_PORT }}"
            export ASPNETCORE_ENVIRONMENT="${{ vars.ASPNETCORE_ENVIRONMENT }}"

            # Secret env files consumed via `env_file:` in docker-compose.prod.yml. Quoted heredocs
            # (<<'EOF') write the GitHub-interpolated values literally — no shell/compose expansion,
            # so special characters in the password are safe. umask 077 keeps them root-only.
            # Split so the short-lived `migrate` container only ever sees the DB connection.
            umask 077
            cat > db.env <<'EOF'
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            EOF
            cat > conn.env <<'EOF'
            Persistence__ConnectionString=${{ secrets.DB_CONNECTION_STRING }}
            EOF
            cat > app.env <<'EOF'
            Telegram__TelegramBotSecretToken=${{ secrets.TELEGRAM_BOT_TOKEN }}
            AiAssistant__OpenAiApiKey=${{ secrets.OPENAI_API_KEY }}
            Telegram__WebhookUrl=${{ secrets.TELEGRAM_WEBHOOK_URL }}
            EOF

            echo "${{ secrets.GHCR_TOKEN }}" | docker login ${{ env.REGISTRY }} \
              -u ${{ github.actor }} --password-stdin

            # Pull the new image, then bring the stack up: postgres (healthy) → migrate (exits 0) → app.
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # Post-deploy verification: `up -d` returns once the app container starts, not once it is
            # actually serving. Poll the container's healthcheck status (defined in the compose file)
            # and fail the workflow if it does not report healthy within the bounded window — a bad
            # migration, missing env var, or startup crash surfaces here instead of shipping silently.
            # No automatic rollback: a failed run is left for the maintainer to act on.
            echo "Waiting for '$APP_CONTAINER_NAME' to report healthy..."
            attempts=36          # 36 * 5s = 180s bounded window
            i=0
            status=""
            while [ "$i" -lt "$attempts" ]; do
              status="$(docker inspect --format '{{.State.Health.Status}}' "$APP_CONTAINER_NAME" 2>/dev/null || echo missing)"
              if [ "$status" = "healthy" ]; then
                echo "App is healthy."
                break
              fi
              if [ "$status" = "unhealthy" ]; then
                echo "App reported unhealthy; deploy failed."
                docker compose -f docker-compose.prod.yml logs --tail=100 app
                exit 1
              fi
              i=$((i + 1))
              echo "  status=$status; retrying in 5s ($i/$attempts)..."
              sleep 5
            done
            if [ "$status" != "healthy" ]; then
              echo "App did not become healthy within $((attempts * 5))s (last status: $status); deploy failed."
              docker compose -f docker-compose.prod.yml logs --tail=100 app
              exit 1
            fi

            docker image prune -f
