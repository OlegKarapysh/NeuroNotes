name: Build and Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and push Docker image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./src/NeuroNotes.WebApi/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to DigitalOcean droplet
    needs: build-and-push
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute lowercase image name
        run: echo "IMAGE_NAME_LC=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Copy compose file to droplet
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_KEY_PASSPHRASE }}
          port: 22
          source: docker-compose.prod.yml
          target: /opt/neuronotes
          overwrite: true

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_KEY_PASSPHRASE }}
          port: 22
          script: |
            set -e
            cd /opt/neuronotes

            # Structural (non-secret) values for compose ${...} substitution.
            export APP_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}:latest"
            export APP_CONTAINER_NAME="${{ vars.CONTAINER_NAME }}"
            export HOST_PORT="${{ vars.HOST_PORT }}"
            export APP_PORT="${{ vars.APP_PORT }}"
            export ASPNETCORE_ENVIRONMENT="${{ vars.ASPNETCORE_ENVIRONMENT }}"

            # Secret env files consumed via `env_file:` in docker-compose.prod.yml. Quoted heredocs
            # (<<'EOF') write the GitHub-interpolated values literally — no shell/compose expansion,
            # so special characters in the password are safe. umask 077 keeps them root-only.
            # Split so the short-lived `migrate` container only ever sees the DB connection.
            umask 077
            cat > db.env <<'EOF'
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            EOF
            cat > conn.env <<'EOF'
            Persistence__ConnectionString=Host=postgres;Port=5432;Database=neuronotes;Username=neuronotes;Password=${{ secrets.POSTGRES_PASSWORD }}
            EOF
            cat > app.env <<'EOF'
            Telegram__TelegramBotSecretToken=${{ secrets.TELEGRAM_BOT_TOKEN }}
            AiAssistant__OpenAiApiKey=${{ secrets.OPENAI_API_KEY }}
            Telegram__WebhookUrl=${{ secrets.TELEGRAM_WEBHOOK_URL }}
            EOF

            echo "${{ secrets.GHCR_TOKEN }}" | docker login ${{ env.REGISTRY }} \
              -u ${{ github.actor }} --password-stdin

            # Pull the new image, then bring the stack up: postgres (healthy) → migrate (exits 0) → app.
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
